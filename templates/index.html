<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PTPN IV - Sistem Izin & Cuti</title>

    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- CSS Utama -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="index-page">

    <section class="hero-section">

        <div class="container">
            <div class="row align-items-center min-vh-100">

                <!-- BAGIAN KIRI -->
                <div class="col-lg-7">

                    <div class="hero-icon mb-4">
                        <i class="bi bi-building"></i>
                    </div>

                    <div class="mb-2">
                        <span class="text-muted fw-semibold">
                            PTPN IV
                        </span>
                    </div>

                    <h1 class="hero-title mb-3">
                        PKS Pulo Tiga
                    </h1>

                    <h2 class="mb-3 fw-semibold">
                        Sistem Izin & Cuti Karyawan
                    </h2>

                    <p class="hero-text mb-4">
                        Aplikasi pengelolaan pengajuan izin dan cuti
                        karyawan secara mudah, cepat, dan terstruktur.
                    </p>

                    <a
                        href="{{ url_for('login') }}"
                        class="btn btn-primary px-4 py-3"
                    >
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Masuk ke Aplikasi
                    </a>

                </div>

                <!-- BAGIAN KANAN -->
                <div class="col-lg-5 d-none d-lg-flex justify-content-center">

                    <div class="text-center">

                        <div class="hero-illustration">
                            <i class="bi bi-calendar-check"></i>
                        </div>

                        <h5 class="mt-4 fw-semibold">
                            Pengajuan Izin & Cuti
                        </h5>

                        <p class="text-muted small">
                            Kelola pengajuan karyawan dengan lebih praktis.
                        </p>

                    </div>

                </div>

            </div>
        </div>

    </section>

</div>

<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
